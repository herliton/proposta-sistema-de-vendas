services:
  mysql:
    image: mysql:8.0
    container_name: vfc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vfc_multimarcas
      MYSQL_USER: vfc_user
      MYSQL_PASSWORD: vfc_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
